<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Path 1 · The balance</title>
<style>html,body{margin:0;height:100%;background:#0A0A0A;display:grid;place-items:center}canvas{display:block;width:100%;height:auto;max-height:100vh;aspect-ratio:16/9;cursor:pointer}</style>
</head><body><canvas aria-label="Animation: a balance scale shows x + 3 = 7; take 3 from both sides, so x = 4"></canvas>
<script>
window.SCENE = {

n:1, emoji:"⚖️", name:"The balance: x + 3 = 7", dur:20,
captions:[[0.3,3.5,"A box and 3 apples weigh the same as 7 apples."],[3.5,7.5,"We write it like this: x + 3 = 7."],[7.5,12,"Take 3 apples off BOTH sides. It stays level."],[12,16,"Now the box weighs 4 apples. So x = 4."],[16,20,"Now write WHY, step by step. ✏️"]],
draw(t){
  const f=prog(t,0.5,1.5);
  poly([[640,440],[600,520],[680,520]],f,C.dim,"rgba(140,150,196,.25)",3);
  line(360,440,920,440,f,C.ink,6);
  line(420,440,420,470,f,C.dim,2); line(860,440,860,470,f,C.dim,2);
  line(320,480,520,480,f,C.blue,6); line(760,480,960,480,f,C.blue,6);
  const off=prog(t,8,10.5);
  const app=(x,y,a)=>{ if(a<=0)return; g.globalAlpha=clamp(a); g.fillStyle=C.pink; g.beginPath(); g.arc(x,y,17,0,7); g.fill(); g.fillStyle="#7BE0A0"; g.fillRect(x-2,y-24,4,9); g.globalAlpha=1; };
  const bx=prog(t,1.4,2.2); box(345,405,66,66,10,"rgba(79,123,255,.35)",C.blue,bx,3); label("x",378,438,bx,C.ink,'italic 700 34px "Times New Roman", serif');
  for(let i=0;i<3;i++){const a=prog(t,1.8+i*0.2,2.4+i*0.2); app(440+i*36,460-60*off,a*(1-off));}
  for(let i=0;i<7;i++){const a=prog(t,2.4+i*0.15,3+i*0.15), gone=i<3?off:0; app(780+(i%4)*38,i<4?460:422-60*gone,a*(1-gone)); }
  label("x + 3 = 7",640,190,fade(t,3.6,4.4,7.6,8),C.ink,'italic 700 52px "Times New Roman", serif');
  label("x + 3 − 3 = 7 − 3",640,190,fade(t,8,8.6,11.6,12),C.cyan,'italic 700 52px "Times New Roman", serif');
  label("x = 4",640,190,prog(t,12.2,13),C.pink,'italic 700 60px "Times New Roman", serif');
  label("still level ✓",640,580,fade(t,10.6,11,15,15.5),C.cyan,`700 24px ${SANS}`);
  const w=prog(t,16.2,17); if(w>0){g.fillStyle=`rgba(10,10,10,${0.78*w})`;g.fillRect(0,0,W,H);} box(330,290,620,80,40,"#0E1430",C.pink,w,3); label("✏️  Your turn: write the reasons",640,330,w,C.ink,`700 30px ${SANS}`);
}
};
</script>
<script src="engine.js"></script>
</body></html>
