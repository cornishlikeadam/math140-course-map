<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Path 2 · The shortcut</title>
<style>html,body{margin:0;height:100%;background:#0A0A0A;display:grid;place-items:center}canvas{display:block;width:100%;height:auto;max-height:100vh;aspect-ratio:16/9;cursor:pointer}</style>
</head><body><canvas aria-label="Animation: walk 3 right and 4 up; squares of 9 and 16 make 25, so the shortcut is 5"></canvas>
<script>
window.SCENE = {

n:2, emoji:"🗺️", name:"The shortcut: 3, 4, ?", dur:20,
captions:[[0.3,3.5,"Walk 3 steps right. Then walk 4 steps up."],[3.5,7.5,"How long is the straight shortcut back?"],[7.5,12,"Build a square on each side: 9 and 16."],[12,16,"9 + 16 = 25. And 5 × 5 = 25. The shortcut is 5!"],[16,20,"Now write WHY, step by step. ✏️"]],
draw(t){
  const u=45, A=[470,420], B=[A[0]+3*u,420], Cc=[B[0],420-4*u];
  g.strokeStyle="rgba(255,255,255,.07)"; g.lineWidth=1;
  for(let i=-3;i<=9;i++){g.beginPath();g.moveTo(A[0]+i*u,90);g.lineTo(A[0]+i*u,600);g.stroke();}
  for(let j=-4;j<=11;j++){g.beginPath();g.moveTo(200,420-j*u+0);g.lineTo(1080,420-j*u);g.stroke();}
  const w1=prog(t,0.8,2.2), w2=prog(t,2.2,3.6);
  line(A[0],A[1],B[0],B[1],w1,C.pink,6); line(B[0],B[1],Cc[0],Cc[1],w2,C.cyan,6);
  const px=w2>0?B[0]:lerp(A[0],B[0],w1), py=w2>0?lerp(B[1],Cc[1],w2):A[1]; dot(px,py,prog(t,0.6,1),C.ink,11);
  label("3",(A[0]+B[0])/2,445,prog(t,1.6,2.2),C.pink,`800 30px ${SANS}`); label("4",B[0]+28,(B[1]+Cc[1])/2,prog(t,3,3.6),C.cyan,`800 30px ${SANS}`);
  g.setLineDash([12,10]); line(A[0],A[1],Cc[0],Cc[1],prog(t,4,5.4),C.blue,5); g.setLineDash([]);
  label("?",A[0]+40,300,fade(t,5,5.6,12,12.4),C.blue,`800 40px ${SANS}`);
  const s1=prog(t,7.6,8.6), s2=prog(t,8.8,9.8), s3=prog(t,10.2,11.2);
  poly([A,B,[B[0],A[1]+3*u],[A[0],A[1]+3*u]],s1,C.pink,"rgba(255,95,162,.18)",3); label("9",(A[0]+B[0])/2,A[1]+1.5*u,s1,C.ink,`800 34px ${SANS}`);
  poly([B,Cc,[Cc[0]+4*u,Cc[1]],[B[0]+4*u,B[1]]],s2,C.cyan,"rgba(34,211,238,.16)",3); label("16",B[0]+2*u,(B[1]+Cc[1])/2,s2,C.ink,`800 34px ${SANS}`);
  const vx=Cc[0]-A[0], vy=Cc[1]-A[1], nx=vy, ny=-vx;
  poly([A,Cc,[Cc[0]+nx,Cc[1]+ny],[A[0]+nx,A[1]+ny]],s3,C.blue,"rgba(79,123,255,.18)",3); label("25",(A[0]+Cc[0]+nx)/2+0,(A[1]+Cc[1]+ny)/2,s3,C.ink,`800 34px ${SANS}`);
  label("9 + 16 = 25",900,170,prog(t,12,12.8),C.ink,'italic 700 40px "Times New Roman", serif');
  label("5 × 5 = 25 → 5",900,230,prog(t,12.8,13.6),C.pink,'italic 700 40px "Times New Roman", serif');
  const w=prog(t,16.2,17); if(w>0){g.fillStyle=`rgba(10,10,10,${0.78*w})`;g.fillRect(0,0,W,H);} box(330,290,620,80,40,"#0E1430",C.pink,w,3); label("✏️  Your turn: write the reasons",640,330,w,C.ink,`700 30px ${SANS}`);
}
};
</script>
<script src="engine.js"></script>
</body></html>
