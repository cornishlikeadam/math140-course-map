<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Our Plan</title>
<style>html,body{margin:0;height:100%;background:#0E1430;display:grid;place-items:center}canvas{display:block;width:100%;height:auto;max-height:100vh;aspect-ratio:16/9;cursor:pointer}</style>
</head><body><canvas aria-label="Animation: a six-week timeline, a trial class, three things to measure, and a small next step"></canvas>
<script>
window.SCENE = {

n:"C", emoji:"🗓️", name:"Our plan", dur:20,
captions:[[0.3,3,"Our plan for the next 6 weeks."],[3,9,"1. Finish the plan. Build. Test with another team."],[9,14,"2. Run a trial class. Measure 3 things."],[14,17.5,"Learning. Safety. Fairness."],[17.5,20,"Then, maybe, a SCADpro project. 🌱"]],
draw(t){
  const tl=t<9?1:1-0.7*prog(t,9,9.6);
  line(120,250,1160,250,prog(t,1,3)*1,C.dim,3);
  const pts=[["Oct 8","M2 plan",C.pink],["Oct 13","Build",C.blue],["Oct 22","Pilot",C.cyan],["Oct 27","Stress test",C.pink],["Nov 5","M3",C.blue],["Nov 19","M4 pitch",C.pink]];
  pts.forEach(([d,n,col],i)=>{const x=170+i*190,k=prog(t,3+i*0.9,3.6+i*0.9)*tl; dot(x,250,k,col,12); label(d,x,210,k,C.dim,`600 18px ${SANS}`); label(n,x,292,k,C.ink,`700 22px ${SANS}`);});
  const tr=prog(t,9.4,10.4); box(470,340,340,64,32,"rgba(34,211,238,.16)",C.cyan,tr,3); label("🧪 Trial class",640,372,tr,C.ink,`700 28px ${SANS}`);
  [["📚 Learning",C.blue],["🛡️ Safety",C.pink],["⚖️ Fairness",C.cyan]].forEach(([n,col],i)=>{const x=300+i*340,k=prog(t,10.6+i*0.7,11.4+i*0.7);
    label(n,x,440,k,C.ink,`700 24px ${SANS}`); box(x-50,462,100,62,31,col+"22",col,k,3); label("?",x,494,k,C.ink,`700 34px ${SANS}`);});
  label("We will measure these. No results yet.",640,560,prog(t,12.6,13.4)*(t<17.5?1:0),C.dim,`600 18px ${SANS}`);
  const s=prog(t,17.6,19); if(s>0){line(1150,560,1150,560-50*s,1,"#7BE0A0",4); dot(1150,560-50*s,s,C.pink,9); label("SCADpro?",1150,600-0*s,s*0.8,C.dim,`600 16px ${SANS}`);}
}
};
</script>
<script src="engine.js"></script>
</body></html>
