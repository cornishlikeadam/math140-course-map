<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Part 1 · Seed: Draw</title>
<style>html,body{margin:0;height:100%;background:#0E1430;display:grid;place-items:center}canvas{display:block;width:100%;height:auto;max-height:100vh;aspect-ratio:16/9;cursor:pointer}</style>
</head><body><canvas aria-label="Animation: draw a line that cuts a segment in half, using a compass"></canvas>
<script>
window.SCENE = {

n:1, emoji:"🌱", name:"Seed: Draw it by hand", dur:18,
captions:[[0.3,2.2,"Part 1. Draw it by hand."],[2.2,5,"1. Draw a line from A to B."],[5,11,"2. Draw two circles the same size."],[11,15,"3. Join the two points where they cross."],[15,18,"The new line cuts AB in half. 🌱 No AI here."]],
draw(t){
  const A=[440,400],B=[840,400],r=260,P=[640,234],Q=[640,566],M=[640,400];
  dot(A[0],A[1],prog(t,1,1.6),C.pink); dot(B[0],B[1],prog(t,1.3,1.9),C.pink);
  label("A",A[0]-28,A[1]+30,prog(t,1,1.6)); label("B",B[0]+28,B[1]+30,prog(t,1.3,1.9));
  line(A[0],A[1],B[0],B[1],prog(t,2.2,4.2),C.blue,5);
  for(const [cx,cy,a,b] of [[A[0],A[1],5,7.6],[B[0],B[1],8.2,10.8]]){
    const k=prog(t,a,b); arc(cx,cy,r,-Math.PI/2,Math.PI*1.5,k,C.cyan,3,[10,8]);
    if(k>0&&k<1){const ang=-Math.PI/2+Math.PI*2*k; line(cx,cy,cx+r*Math.cos(ang),cy+r*Math.sin(ang),1,"rgba(34,211,238,.55)",2); dot(cx+r*Math.cos(ang),cy+r*Math.sin(ang),1,C.cyan,6);}
  }
  dot(P[0],P[1],prog(t,11,11.6),C.pink,10); dot(Q[0],Q[1],prog(t,11.3,11.9),C.pink,10);
  label("P",P[0]+30,P[1]-14,prog(t,11,11.6)); label("Q",Q[0]+30,Q[1]+14,prog(t,11.3,11.9));
  line(640,186,640,600,prog(t,12.2,14.2),C.pink,5);
  const m=prog(t,14.4,15); dot(M[0],M[1],m,C.ink,7);
  if(m>0){g.globalAlpha=m;g.strokeStyle=C.ink;g.lineWidth=2;g.strokeRect(640,376,24,24);g.globalAlpha=1;}
  const s=prog(t,15.2,16); for(const x of [540,740]){line(x-6,388,x+6,412,s,C.pink,3);line(x+2,388,x+14,412,s,C.pink,3);}
}
};
</script>
