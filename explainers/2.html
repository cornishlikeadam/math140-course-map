<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Part 2 · Sprout: Write</title>
<style>html,body{margin:0;height:100%;background:#0E1430;display:grid;place-items:center}canvas{display:block;width:100%;height:auto;max-height:100vh;aspect-ratio:16/9;cursor:pointer}</style>
</head><body><canvas aria-label="Animation: write a two-column proof that crossing lines make equal angles"></canvas>
<script>
window.SCENE = {

n:2, emoji:"🌿", name:"Sprout: Write your own proof", dur:18,
captions:[[0.3,2.5,"Part 2. Write your own proof."],[2.5,5,"1. Look at what you know."],[5,10,"2. Write one step on each line."],[10,15,"3. Give every step a reason."],[15,18,"A reason is a rule. It is not a picture. 🌿"]],
draw(t){
  const cx=290,cy=380,d=Math.PI/180;
  line(120,260,460,500,prog(t,1.2,2.6),C.blue,5); line(120,500,460,260,prog(t,1.6,3),C.blue,5);
  const a=144.78*d,b=35.22*d, pulse=t>15?1+0.25*Math.sin((t-15)*6):1;
  arc(cx,cy,46*pulse,a,2*Math.PI-a,prog(t,3,3.8),C.pink,5);
  arc(cx,cy,46,-a,-b,prog(t,3.3,4.1),C.cyan,5);
  arc(cx,cy,46*pulse,-b,b,prog(t,3.6,4.4),C.pink,5);
  label("1",cx-80,cy,prog(t,3,3.8),C.pink); label("2",cx,cy-80,prog(t,3.3,4.1),C.cyan); label("3",cx+80,cy,prog(t,3.6,4.4),C.pink);
  const hx=560; label("Statement",hx,190,prog(t,4.4,5),C.dim,`600 20px ${SANS}`,"left"); label("Reason",900,190,prog(t,4.4,5),C.dim,`600 20px ${SANS}`,"left");
  line(hx,212,1220,212,prog(t,4.4,5.2),"rgba(255,255,255,.25)",2);
  const rows=[["∠1 + ∠2 = 180°","Straight line = 180°"],["∠2 + ∠3 = 180°","Straight line = 180°"],["∠1 + ∠2 = ∠2 + ∠3","Both equal 180°"],["∠1 = ∠3","Take ∠2 from both sides"]];
  rows.forEach(([s,r],i)=>{const y=262+i*70,t0=5+i*2.4;
    type(s,hx,y,prog(t,t0,t0+1.1),C.ink,'italic 600 28px "Times New Roman", serif');
    type(r,900,y,prog(t,t0+1.2,t0+1.9),C.blue,`600 22px ${SANS}`);
    const k=prog(t,t0+2,t0+2.3); if(k>0){g.globalAlpha=k;g.strokeStyle=C.pink;g.lineWidth=4;g.beginPath();g.moveTo(1196,y);g.lineTo(1206,y+10);g.lineTo(1226,y-12);g.stroke();g.globalAlpha=1;}
  });
}
};
</script>
<script src="engine.js"></script>
</body></html>
